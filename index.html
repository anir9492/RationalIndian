		<noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
		
		<style>
			/* Turn off the template's default circle and icon for our custom logos */
			#header nav a.custom-logo:before {
				display: none !important; 
			}
			
			/* INCREASED LOGO SIZES */
			#header nav a.custom-logo img {
				height: 4.5em; 
				width: 4.5em;  
				object-fit: contain; 
				background-color: rgba(255, 255, 255, 0.8); 
				border-radius: 50%;
				padding: 8px; 
				transition: all 0.2s ease-in-out;
				vertical-align: middle; 
			}
			
			/* Recreate the "pop" hover effect */
			#header nav a.custom-logo:hover img {
				transform: scale(1.15);
				background-color: #ffffff;
			}

			/* ==========================================================
			   CUSTOM CHALCHITRA ANIMATION & TIMING VISION
			   ========================================================== */

			/* 1. Chalchitra Narrative Pan & Zoom Effect on #bg */
			@keyframes chalchitraReveal {
				0% {
					background-position: 0% 50%;
					background-size: 150% auto; /* Starts zoomed in on the left chemical genesis */
				}
				60% {
					background-position: 100% 50%; /* Smoothly scrolls across to the wildlife sunrise on the right */
					background-size: 115% auto;
				}
				100% {
					background-position: 100% 50%; /* Settles completely to show the full narrative banner */
					background-size: cover;        /* Fills the screen perfectly at the end */
				}
			}

			/* Apply animation when the page loads (body class is-preload removed) */
			body:not(.is-preload) #bg {
				animation: chalchitraReveal 5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
			}

			/* Fallback static starting point for pre-load state */
			#bg {
				background-position: 0% 50%;
				background-size: 150% auto;
			}

			/* 2. Smoother, Faster Text & Header Fade-In */
			body:not(.is-preload) #header {
				animation: smoothHeaderFade 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
				animation-delay: 0.2s; /* Appears smoothly and quickly */
				opacity: 0;
			}

			@keyframes smoothHeaderFade {
				0% {
					opacity: 0;
					transform: translateY(15px);
				}
				100% {
					opacity: 1;
					transform: translateY(0);
				}
			}

			/* 3. Staggered "Pop-In" Animation for Magazine Icons */
			body:not(.is-preload) #header nav ul li {
				opacity: 0;
				transform: scale(0.7) translateY(10px);
				animation: iconPopIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
			}

			/* Stagger the timing for each icon so they ripple gracefully */
			body:not(.is-preload) #header nav ul li:nth-child(1) { animation-delay: 0.5s; }
			body:not(.is-preload) #header nav ul li:nth-child(2) { animation-delay: 0.6s; }
			body:not(.is-preload) #header nav ul li:nth-child(3) { animation-delay: 0.7s; }
			body:not(.is-preload) #header nav ul li:nth-child(4) { animation-delay: 0.8s; }
			body:not(.is-preload) #header nav ul li:nth-child(5) { animation-delay: 0.9s; }
			body:not(.is-preload) #header nav ul li:nth-child(6) { animation-delay: 1.0s; }
			body:not(.is-preload) #header nav ul li:nth-child(7) { animation-delay: 1.1s; }

			@keyframes iconPopIn {
				0% {
					opacity: 0;
					transform: scale(0.7) translateY(10px);
				}
				70% {
					transform: scale(1.1) translateY(-2px); /* Slight over-shoot for the "pop" vibe */
				}
				100% {
					opacity: 1;
					transform: scale(1) translateY(0);
				}
			}

			/* Force the background settings for mobile devices */
			@media screen and (max-width: 736px) {
				#bg {
					background-size: auto 100% !important;
					background-position: left center !important;
					animation: none !important; /* Keep mobile stable for touch screens */
				}
			}
		</style>
