		<style>
			/* Turn off the template's default circle and icon for our custom logos */
			#header nav a.custom-logo:before {
				display: none !important; 
			}
			
			/* INCREASED LOGO SIZES */
			#header nav a.custom-logo img {
				height: 4.5em; 
				width: 4.5em;  
				object-fit: contain; 
				background-color: rgba(255, 255, 255, 0.8); 
				border-radius: 50%;
				padding: 8px; 
				transition: all 0.2s ease-in-out;
				vertical-align: middle; 
			}
			
			/* Recreate the "pop" hover effect */
			#header nav a.custom-logo:hover img {
				transform: scale(1.15);
				background-color: #ffffff;
			}

			/* ==========================================================
			   CHALCHITRA NARRATIVE ZOOM & PAN ANIMATION
			   ========================================================== */
			
			/* Force background sizing baseline for the animation */
			#bg {
				background-position: 0% 50% !important;
				background-size: 160% auto !important;
			}

			/* Keyframes: Starts zoomed in on the left (DNA/chemistry genesis), 
			   pans smoothly across to the right ecosystem/wildlife sunrise, then settles. */
			@keyframes chalchitraNarrative {
				0% {
					background-position: 0% 50%;
					background-size: 160% auto;
				}
				65% {
					background-position: 100% 50%;
					background-size: 115% auto;
				}
				100% {
					background-position: 100% 50%;
					background-size: cover;
				}
			}

			/* Trigger animation as soon as the preloader lifts */
			body:not(.is-preload) #bg {
				animation: chalchitraNarrative 5.5s cubic-bezier(0.25, 1, 0.3, 1) forwards;
			}

			/* ==========================================================
			   SMOOTHER, FASTER HEADER & STAGGERED ICON POP-IN
			   ========================================================== */

			body:not(.is-preload) #header {
				opacity: 0;
				animation: smoothHeaderFade 1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
			}

			@keyframes smoothHeaderFade {
				0% {
					opacity: 0;
					transform: translateY(15px);
				}
				100% {
					opacity: 1;
					transform: translateY(0);
				}
			}

			/* Staggered Pop-In for Magazine Icons */
			body:not(.is-preload) #header nav ul li {
				opacity: 0;
				transform: scale(0.5) translateY(10px);
				animation: iconPopIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
			}

			body:not(.is-preload) #header nav ul li:nth-child(1) { animation-delay: 0.35s; }
			body:not(.is-preload) #header nav ul li:nth-child(2) { animation-delay: 0.42s; }
			body:not(.is-preload) #header nav ul li:nth-child(3) { animation-delay: 0.49s; }
			body:not(.is-preload) #header nav ul li:nth-child(4) { animation-delay: 0.56s; }
			body:not(.is-preload) #header nav ul li:nth-child(5) { animation-delay: 0.63s; }
			body:not(.is-preload) #header nav ul li:nth-child(6) { animation-delay: 0.70s; }
			body:not(.is-preload) #header nav ul li:nth-child(7) { animation-delay: 0.77s; }

			@keyframes iconPopIn {
				0% {
					opacity: 0;
					transform: scale(0.5) translateY(10px);
				}
				70% {
					transform: scale(1.15) translateY(-2px); /* Deliberate organic pop/overshoot */
				}
				100% {
					opacity: 1;
					transform: scale(1) translateY(0);
				}
			}

			/* Mobile layout stability */
			@media screen and (max-width: 736px) {
				#bg {
					background-size: auto 100% !important;
					background-position: left center !important;
					animation: none !important;
				}
			}
