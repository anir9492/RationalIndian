		<style>
			/* Turn off the template's default circle and icon for our custom logos */
			#header nav a.custom-logo:before {
				display: none !important; 
			}
			
			/* INCREASED LOGO SIZES & CLICKABILITY FIX */
			#header nav a.custom-logo {
				position: relative;
				z-index: 1000;
				display: inline-block;
			}

			#header nav a.custom-logo img {
				height: 4.5em; 
				width: 4.5em;  
				object-fit: contain; 
				background-color: rgba(255, 255, 255, 0.8); 
				border-radius: 50%;
				padding: 8px; 
				transition: all 0.2s ease-in-out;
				vertical-align: middle; 
			}
			
			/* Recreate the "pop" hover effect */
			#header nav a.custom-logo:hover img {
				transform: scale(1.15);
				background-color: #ffffff;
			}

			/* ==========================================================
			   HOVER TOOLTIPS FOR PUBLICATION LOGOS
			   ========================================================== */
			#header nav a.custom-logo::after {
				content: attr(data-label); /* Pulls the name from the HTML tag */
				position: absolute;
				bottom: -20px; 
				left: 50%;
				transform: translateX(-50%);
				color: rgba(255, 255, 255, 0.95);
				font-size: 0.7rem;
				font-weight: 600;
				letter-spacing: 0.05em;
				white-space: nowrap;
				background: rgba(0, 0, 0, 0.7); /* Dark pill background */
				padding: 4px 10px;
				border-radius: 12px;
				opacity: 0;
				visibility: hidden;
				transition: all 0.25s ease;
				pointer-events: none; /* Prevents mouse interference */
				box-shadow: 0 4px 10px rgba(0,0,0,0.3);
			}

			#header nav a.custom-logo:hover::after {
				opacity: 1;
				visibility: visible;
				bottom: -35px; /* Creates a smooth drop-down motion */
			}

			/* ==========================================================
			   MODERN HEADSHOT WITH ENHANCED LENSING EFFECT
			   ========================================================== */
			#header .headshot {
				margin-bottom: 1.5rem;
			}
			
			#header .headshot img {
				width: 135px;
				height: 135px;
				object-fit: cover;
				border-radius: 50%; 
				box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45); 

				/* Enhancing the glass/lens effect */
				background: rgba(255, 255, 255, 0.03); /* Faint physical glass tint */
				backdrop-filter: blur(4px) saturate(120%); /* Blurs and boosts colors behind it */
				-webkit-backdrop-filter: blur(4px) saturate(120%); /* Safari support */
				opacity: 0.95;
				
				transition: all 0.25s ease;
			}
			
			#header .headshot img:hover {
				transform: translateY(-2px);
				opacity: 1;
				backdrop-filter: blur(0px); /* Clears the glass when hovered */
				-webkit-backdrop-filter: blur(0px);
			}

			/* BRING CONTENT TO THE FRONT SO IT IS CLICKABLE */
			#main {
				position: relative !important;
				z-index: 10 !important;
			}

			/* ==========================================================
			   FIX: RESET CONTAINER SIZE AND ANIMATE PAN & STOP
			   ========================================================== */

			/* 1. Kill the template's default gradient pseudo-layers */
			#bg:before, #bg:after {
				display: none !important;
				animation: none !important;
			}

			body, #wrapper {
				background-color: #000000 !important; 
				background-image: none !important;
			}

			/* 2. Lock the container to exactly the screen size and Pan */
			#bg {
				position: fixed !important;
				top: 0 !important;
				left: 0 !important;
				width: 100vw !important;
				height: 100vh !important;
				transform: none !important; 

				background-image: url('images/bg.jpg') !important; 
				background-color: #000000 !important; 
				background-size: auto 100% !important; 
				background-repeat: no-repeat !important;

				/* Smooth pan from left to right, locking at the end */
				animation: panAndStop 12s ease-out forwards !important;
			}

			@keyframes panAndStop {
				0% { background-position: left center; }
				100% { background-position: right center; }
			}

			#overlay {
				opacity: 0.15 !important;
				pointer-events: none !important; 
			}

			/* ==========================================================
			   RESPONSIVE DESIGN: IPAD / TABLET (Max Width: 1024px)
			   ========================================================== */
			@media screen and (max-width: 1024px) {
				#bg {
					background-size: cover !important; 
					background-position: center center !important; 
					animation: none !important; 
				}
				#header .headshot img {
					width: 115px; 
					height: 115px;
				}
			}

			/* ==========================================================
			   RESPONSIVE DESIGN: MOBILE PHONE (Max Width: 736px)
			   ========================================================== */
			@media screen and (max-width: 736px) {
				#header .headshot img {
					width: 100px;
					height: 100px;
					margin-bottom: 1rem;
				}

				#header h1 { font-size: 2.2rem; }
				
				#header p {
					font-size: 0.9rem;
					line-height: 1.5;
					padding: 0 10px;
				}

				#header nav ul {
					display: flex !important;
					flex-wrap: wrap !important;
					justify-content: center !important;
					gap: 15px 12px !important; /* Extra vertical gap to account for tooltips */
					margin: 0 !important;
					padding: 0 15px !important;
				}
				
				#header nav ul li {
					display: block !important;
					margin: 0 !important; 
				}

				#header nav a.custom-logo img {
					height: 3.5em; 
					width: 3.5em;  
					padding: 6px; 
				}
			}
		</style>
